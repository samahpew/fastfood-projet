# Projet FastFood.ma - Ecosysteme Big Data 2
# Kafka (KRaft) + Spark 3.5 standalone (1 Master, 2 Workers) + MinIO + Jupyter/PySpark
#
#   docker compose up -d        -> demarre tout
#   docker compose ps           -> etat des services
#   docker compose down         -> arrete tout (les donnees MinIO/Kafka sont conservees)
#
# Master, Workers et Jupyter utilisent la MEME image : meme Spark (3.5.3) et
# meme Python cote Driver et cote Executors (obligatoire pour les RDD Python).

x-spark-image: &spark-image quay.io/jupyter/pyspark-notebook:spark-3.5.3

services:

  # ---------------------------------------------------------------- Kafka --
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9094:9094"            # acces depuis Windows : localhost:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # cree le topic "orders" (3 partitions) puis s'arrete
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic orders
    restart: "no"

  # ---------------------------------------------------------------- MinIO --
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"            # API S3
      - "9001:9001"            # console web : http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # client MinIO : cree le bucket "lake" puis reste disponible pour
  #   docker compose exec mc mc ls --recursive local/lake/
  mc:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z   # contient aussi le client mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done
        mc mb --ignore-existing local/lake
        echo "Bucket lake pret"
        tail -f /dev/null

  # ---------------------------------------------------------------- Spark --
  spark-master:
    healthcheck:
      disable: true          # le healthcheck de l'image vise Jupyter, pas Spark
    image: *spark-image
    hostname: spark-master
    command: ["/usr/local/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8090:8080"            # Spark Master UI : http://localhost:8090 (8080 est pris par Airflow)
      - "7077:7077"

  spark-worker-1:
    healthcheck:
      disable: true          # le healthcheck de l'image vise Jupyter, pas Spark
    image: *spark-image
    hostname: spark-worker-1
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_DIR: /tmp/spark-work
    command: ["/usr/local/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "4", "--memory", "2g", "--webui-port", "8081"]
    ports:
      - "8081:8081"

  spark-worker-2:
    healthcheck:
      disable: true          # le healthcheck de l'image vise Jupyter, pas Spark
    image: *spark-image
    hostname: spark-worker-2
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_DIR: /tmp/spark-work
    command: ["/usr/local/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "4", "--memory", "2g", "--webui-port", "8081"]
    ports:
      - "8082:8081"

  # Spark History Server : DAG / stages des applications terminees (captures du rapport)
  spark-history:
    healthcheck:
      disable: true
    image: *spark-image
    hostname: spark-history
    command: ["/usr/local/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=file:///spark-events -Dspark.history.fs.update.interval=5s"
    ports:
      - "18080:18080"          # http://localhost:18080
    volumes:
      - ./spark-events:/spark-events

  # ----------------------------------------------------- Jupyter (Driver) --
  jupyter:
    image: *spark-image
    hostname: jupyter
    depends_on: [spark-master, kafka, minio]
    command: ["start-notebook.py", "--IdentityProvider.token=", "--ServerApp.root_dir=/home/jovyan/work"]
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      KAFKA_BOOTSTRAP: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8888:8888"            # Jupyter : http://localhost:8888
      - "4040-4042:4040-4042"  # Spark UI de l'application (DAG, stages)
    volumes:
      - ./:/home/jovyan/work

volumes:
  kafka-data:
  minio-data:
